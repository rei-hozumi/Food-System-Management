<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

<link rel="stylesheet" th:href="@{/css/products.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">

<title>製造計画登録</title>

</head>

<body>

	<header>

		<div class="version">Ver.1.0</div>

		<h1 class="title">Food System Management</h1>

	<form th:action="@{/logout}" method="post">
	    <div class="header-right">
	        <button type="submit">ログアウト</button>
	    </div>
	</form>

	</header>

	<main class="page">

		<div class="page-header">
			<h2>製造計画登録</h2>
		</div>

		<div class="table-card">

			<form th:action="@{/productionPlans/register}" th:object="${productionPlan}"
				method="post" class="edit-form">

				<div class="form-group">
					<label>注文番号</label>
						<select id="orderSelect" name="orderId">
							<option value="">選択してください</option>
							<option th:each="order : ${orders}" th:value="${order.id}"
								th:text="${order.orderNumber}"></option>
						</select>
				</div>

				<div class="form-group">
					<label>商品名</label> <input type="text" id="productName" readonly>
				</div>

				<!--             <div class="form-group">
                <label>商品ID</label>
                	<select th:field="*{product}">
                	<option value="">選択してください</option>
					    <option th:each="product : ${products}"
					            th:value="${product.id}"
					            th:text="${product.productNumber}">
					    </option>
					</select>
            </div> -->

				<div class="form-group">
				    <label>注文数量</label>
				    <input type="text" id="orderQuantity" readonly>
				</div>
				
				<div class="form-group">
				    <label>製造数量</label>
				    <input type="number" th:field="*{plannedQuantity}">
				    <div class="error" th:errors="*{plannedQuantity}"></div>
				</div>

				<div class="form-group">
					<label>担当者</label> <select th:field="*{assignedUser}">
						<option value="">選択してください</option>
						<option th:each="user : ${users}" th:value="${user.id}"
							th:text="${user.userName}"></option>
					</select>
					<div class="error" th:errors="*{assignedUser}"></div>
				</div>

				<div class="form-group">
					<label>製造ステータス</label> <select th:field="*{status}">
						<option value="">選択してください</option>
						<option value="未着手">未着手</option>
						<option value="製造中">製造中</option>
						<option value="完了">完了</option>
					</select>
					<div class="error" th:errors="*{status}"></div>
				</div>

				<div class="form-group">
					<label>製造開始日</label> <input type="date" th:field="*{productionDate}">
					<div class="error" th:errors="*{productionDate}"></div>
				</div>
				
				<div class="form-group">
					<label>納期</label> <input type="text" id="dueDate" readonly>
				</div>

				<div class="form-actions">
					<a th:href="@{/productionPlans/list}" class="back-btn"> 戻る </a>

					<button type="submit" class="add-btn">登録</button>

				</div>

			</form>

		</div>

	</main>

	<script>
		document.getElementById("orderSelect")
		.addEventListener("change", function(){
		    const orderId = this.value;
		    if(orderId === ""){
		        document.getElementById("productName").value = "";
		        document.getElementById("dueDate").value = "";
		        document.getElementById("orderQuantity").value = "";
		        return;
		    }
		    fetch("/orders/api/" + orderId).then(response => response.json())
										   .then(order => {
				document.getElementById("dueDate").value =
					order.dueDate;
		        document.getElementById("productName").value =
		            order.product.productName;
		        document.getElementById("orderQuantity").value =
		            order.orderQuantity;
		    });
		});
	</script>
</body>

</html>
