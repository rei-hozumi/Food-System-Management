<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
<link rel="stylesheet" th:href="@{/css/products.css}">

<title>製造計画登録</title>
</head>

<body>

<header>
    <div class="version">Ver.1.0</div>
    <h1 class="title">Food System Management</h1>
    <div class="header-right">
        <button type="button" onclick="location.href='/'">終了</button>
    </div>
</header>

<main class="page">

    <div class="page-header">
        <h2>製造計画登録</h2>
    </div>

    <div class="table-card">

		<form th:action="@{/productionPlans/update}"
		      th:object="${productionPlan}"
		      method="post"
		      class="edit-form">
		      <input type="hidden" th:field="*{id}">

            <!-- 注文 -->
            <div class="form-group">
                <label>注文</label>
                <select th:field="*{order}">
                    <option value="">選択してください</option>
                    <option th:each="order : ${orderList}"
                            th:value="${order.id}"
                            th:text="${order.id}">
                    </option>
                </select>
                <div class="error"
                     th:errors="*{order}"></div>
            </div>

            <!-- 商品 -->
            <div class="form-group">
                <label>商品</label>
                <select th:field="*{product}">
                    <option value="">選択してください</option>
                    <option th:each="product : ${productList}"
                            th:value="${product.id}"
                            th:text="${product.productName}">
                    </option>
                </select>
            </div>

            <!-- 製造数量 -->
            <div class="form-group">
                <label>製造数量</label>
                <input type="number"
                       th:field="*{plannedQuantity}">
                <div class="error"
                     th:errors="*{plannedQuantity}"></div>
            </div>

            <!-- 担当者 -->
            <div class="form-group">
                <label>担当者</label>
                <select th:field="*{assignedUser}">
                    <option value="">選択してください</option>
                    <option th:each="user : ${userList}"
                            th:value="${user.id}"
                            th:text="${user.userName}">
                    </option>
                </select>
                <div class="error"
                     th:errors="*{assignedUser}"></div>
            </div>

            <!-- ステータス -->
            <div class="form-group">
                <label>ステータス</label>

                <select th:field="*{status}">
                    <option value="">選択してください</option>
                    <option value="未着手">未着手</option>
                    <option value="製造中">製造中</option>
                    <option value="完了">完了</option>
                </select>

                <div class="error"
                     th:errors="*{status}"></div>

            </div>

            <!-- 製造日 -->
            <div class="form-group">
                <label>製造日</label>
                <input type="date"
                       th:field="*{productionDate}">
                <div class="error"
                     th:errors="*{productionDate}"></div>
            </div>

            <div class="form-actions">

                <a th:href="@{/productionPlans/list}"
                   class="back-btn">
                    戻る
                </a>

                <button type="submit"
                        class="add-btn">
                    登録
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
