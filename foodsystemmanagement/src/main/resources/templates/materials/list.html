<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
     <link rel="stylesheet" th:href="@{css/products.css}">

    <title>原材料一覧 - Food System Management</title>
</head>
<body>

<header>
    <div class="version">Ver.1.0</div>
    <h1 class="title">Food System Management</h1>
    <div class="header-right">
        <button type="button" onclick="location.href='/'">終了</button>
    </div>
</header>

<main class="page">

    <div class="page-header">
        <h2>原材料管理一覧</h2>

        <a th:href="@{/materials/register}" class="add-btn">
            ＋ 新規登録
        </a>
    </div>

    <div class="table-card">

        <table class="product-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>原材料コード</th>
                    <th>原材料名</th>
                    <th>単価</th>
                    <th>在庫数</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="material : ${materialList}">
                    <td th:text="${material.id}"></td>
                    <td th:text="${material.materialCode}"></td>
                    <td th:text="${material.materialName}"></td>
                    <td th:text="${#numbers.formatInteger(material.price,1,'COMMA')} + ' 円'"></td>
                    <td th:text="${material.stockQuantity}"></td>
                    <td>
                        <a th:href="@{/materials/edit/{id}(id=${material.id})}"
                           class="edit-btn">
                            編集
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div class="bottom-actions">
        <a th:href="@{/}" class="back-btn">
            ← 管理画面へ戻る
        </a>
    </div>

</main>
</body>
</html>
