<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org">
<head>
<meta charset="UTF-8">
<title>商品編集</title>
</head>
<body>
	
	<h1>商品管理（編集）</h1>
	
	<form th:action="@{/products/update}"
	      th:object="${product}"
	      method="post">

	    <input type="hidden" th:field="*{id}">

	    商品コード
	    <input type="text" th:field="*{productCode}">
	    <br>

	    商品名
	    <input type="text" th:field="*{productName}">
	    <br>

	    価格
	    <input type="number" th:field="*{price}">
	    <br>

	    賞味期限
	    <input type="date" th:field="*{expirationDate}">
	    <br>

	    <button>更新</button>
	</form>
		<a th:href="@{/products/list}">製品一覧へ戻る</a>
	<a href="">管理TOPへ戻る</a>
</body>
</html>
