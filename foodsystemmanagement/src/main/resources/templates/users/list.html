<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/products.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">

<title>ユーザー一覧 - Food System Management</title>

</head>
<body>
	<header>
		<div class="version">Ver.1.0</div>
		<h1 class="title">Food System Management</h1>

		<form th:action="@{/logout}" method="post">
			<div class="header-right">
				<button type="submit">ログアウト</button>
			</div>
		</form>
	</header>
	<main class="page">

		<div class="page-header">
			<h2>ユーザー一覧</h2>

			<div th:if="${message}" class="success-message">
				<p th:text="${message}"></p>
			</div>
			<div th:if="${error}" class="error-message">
				<p th:text="${error}"></p>
			</div>

			<a th:href="@{/users/register}" class="add-btn"> ＋ 新規登録 </a>

		</div>

		<!-- 検索 -->
		<form th:action="@{/users/search}" method="get" class="search-form">


			<div class="form-group">
				<label>社員番号</label> <input type="text" name="keyword"
					placeholder="社員番号を入力" th:value="${keyword}">
			</div>

			<div class="form-actions">
				<button type="submit" class="add-btn">検索</button>
			</div>

		</form>

		<div class="table-card">
			<table class="product-table">
				<thead>
					<tr>
						<th>社員番号</th>
						<th>ユーザー名</th>
						<th>権限</th>
						<th></th>
						<th></th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="user : ${userList}">
						<td th:text="${user.loginId}"></td>
						<td th:text="${user.userName}"></td>
						<td th:text="${user.roleName}"></td>
						<td><a th:if="${user.enabled}"th:href="@{/users/edit/{id}(id=${user.id})}"
							class="edit-btn"> 編集 </a></td>
						<td><span th:if="${user.enabled}">
								<form th:action="@{/users/delete/{id}(id=${user.id})}"
									method="post" onsubmit="return confirm('このユーザーを無効化しますか？');">

									<button type="submit">無効化</button>

								</form>
						</span> <span th:unless="${user.enabled}"> 無効 </span></td>

					</tr>
				</tbody>
			</table>
		</div>

		<div class="bottom-actions">
			<a th:href="@{/top}" class="back-btn"> ← 管理画面へ戻る </a>
		</div>

	</main>
</body>
</html>
